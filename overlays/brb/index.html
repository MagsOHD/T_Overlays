<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be Right Back</title>
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container gradient-bg-alt">
    <div class="decorative-shape" style="width: 350px; height: 350px; background: var(--soft-blue); top: 15%; right: 10%;"></div>
    <div class="decorative-shape" style="width: 280px; height: 280px; background: var(--soft-mint); bottom: 10%; left: 5%; animation-delay: 3s;"></div>

    <div class="content">
      <div class="icon-wrapper gentle-float">
        <div class="icon">☕</div>
      </div>

      <h1 class="title slide-down">Petite pause</h1>
      
      <p class="message gentle-pulse" id="message">Je reviens dans un instant 💜</p>

      <div class="timer-card glass-effect slide-up" id="timerCard">
        <div class="timer" id="timer">00:00</div>
      </div>

      <div class="info fade-in">
        <p>💬 Le chat est toujours actif</p>
        <p>🌿 Prenez soin de vous</p>
      </div>
    </div>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
