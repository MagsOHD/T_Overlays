<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be Right Back</title>
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="background-animation"></div>

    <div class="content">
      <div class="icon-container">
        <div class="sleeping-cat">
          <div class="cat-zzz">
            <span>Z</span>
            <span>Z</span>
            <span>Z</span>
          </div>
          <div class="cat-sleeping">
            <div class="cat-head-sleep">
              <div class="cat-ear-sleep cat-ear-left-sleep"></div>
              <div class="cat-ear-sleep cat-ear-right-sleep"></div>
              <div class="cat-eye-closed cat-eye-left-closed"></div>
              <div class="cat-eye-closed cat-eye-right-closed"></div>
            </div>
            <div class="cat-body-sleep">
              <div class="cat-belly"></div>
            </div>
            <div class="cat-tail-sleep"></div>
          </div>
        </div>
        <div class="coffee-cup">☕</div>
        <div class="steam">
          <span class="steam-particle"></span>
          <span class="steam-particle"></span>
          <span class="steam-particle"></span>
        </div>
      </div>

      <h1 class="main-title">
        <span class="letter">B</span>
        <span class="letter">E</span>
        <span class="space"></span>
        <span class="letter">R</span>
        <span class="letter">I</span>
        <span class="letter">G</span>
        <span class="letter">H</span>
        <span class="letter">T</span>
        <span class="space"></span>
        <span class="letter">B</span>
        <span class="letter">A</span>
        <span class="letter">C</span>
        <span class="letter">K</span>
      </h1>

      <div class="subtitle">
        <p class="message" id="message">De retour dans quelques instants...</p>
      </div>

      <div class="timer-container glass-effect" id="timerContainer">
        <div class="timer-icon">⏱️</div>
        <div class="timer-value" id="timer">00:00</div>
      </div>

      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>

      <div class="info-messages">
        <p class="info-item">💬 Le chat est toujours ouvert !</p>
        <p class="info-item">🎵 Profitez de la musique</p>
        <p class="info-item">👋 Merci de votre patience</p>
      </div>
    </div>

    <div class="floating-emojis">
      <span class="emoji">🐱</span>
      <span class="emoji">😸</span>
      <span class="emoji">🎮</span>
      <span class="emoji">☕</span>
      <span class="emoji">💜</span>
      <span class="emoji">😻</span>
      <span class="emoji">⭐</span>
      <span class="emoji">🐾</span>
    </div>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
