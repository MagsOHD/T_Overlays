<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Ended</title>
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container gradient-bg">
    <div class="decorative-shape" style="width: 320px; height: 320px; background: var(--soft-pink); top: 8%; left: 10%;"></div>
    <div class="decorative-shape" style="width: 270px; height: 270px; background: var(--soft-lavender); bottom: 12%; right: 8%; animation-delay: 2s;"></div>
    <div class="decorative-shape" style="width: 230px; height: 230px; background: var(--soft-mint); top: 45%; right: 12%; animation-delay: 4s;"></div>

    <div class="content">
      <div class="heart-icon gentle-float">💜</div>

      <h1 class="title slide-down">Merci d'avoir été là</h1>
      
      <p class="message fade-in" id="message">Prenez soin de vous, à très bientôt !</p>

      <div class="next-stream glass-effect slide-up">
        <p id="nextStream">On se retrouve bientôt pour de nouvelles aventures ✨</p>
      </div>

      <div class="social-grid fade-in">
        <div class="social-card glass-effect">
          <span class="social-emoji">📺</span>
          <span id="twitch">twitch.tv/votre_channel</span>
        </div>
        <div class="social-card glass-effect">
          <span class="social-emoji">💬</span>
          <span id="discord">discord.gg/votre_discord</span>
        </div>
      </div>

      <div class="farewell">
        <p>À bientôt dans cet espace bienveillant 🌸</p>
      </div>
    </div>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
