<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starting Soon</title>
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container gradient-bg">
    <!-- Formes décoratives douces -->
    <div class="decorative-shape" style="width: 300px; height: 300px; background: var(--soft-lavender); top: 10%; left: 5%;"></div>
    <div class="decorative-shape" style="width: 250px; height: 250px; background: var(--soft-mint); bottom: 15%; right: 8%; animation-delay: 2s;"></div>
    <div class="decorative-shape" style="width: 200px; height: 200px; background: var(--soft-peach); top: 50%; right: 15%; animation-delay: 4s;"></div>

    <div class="content">
      <!-- En-tête doux -->
      <div class="header slide-down">
        <h1 class="title">Le stream commence bientôt</h1>
        <p class="subtitle" id="subtitle">Un espace pour se détendre et s'amuser ensemble 💜</p>
      </div>

      <!-- Countdown épuré -->
      <div class="countdown-wrapper slide-up">
        <div class="countdown glass-effect">
          <div class="time-block">
            <span class="time-value" id="minutes">05</span>
            <span class="time-label">min</span>
          </div>
          <span class="time-separator">:</span>
          <div class="time-block">
            <span class="time-value" id="seconds">00</span>
            <span class="time-label">sec</span>
          </div>
        </div>
      </div>

      <!-- Message d'accueil rotatif -->
      <div class="welcome-message gentle-pulse">
        <p class="message-text" id="welcomeMessage">Bienvenue dans cet espace bienveillant</p>
      </div>

      <!-- Infos sociales minimalistes -->
      <div class="social-links fade-in">
        <div class="social-link">
          <span>📺</span>
          <span id="twitch">twitch.tv/votre_channel</span>
        </div>
        <div class="social-link">
          <span>💬</span>
          <span id="discord">discord.gg/votre_discord</span>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
