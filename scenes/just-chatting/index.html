<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Chatting</title>
  <link rel="stylesheet" href="../../css/organic-global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="overlay-container">
    <!-- Formes organiques de fond -->
    <div class="organic-bg">
      <div class="organic-shape shape-1" style="width: 500px; height: 500px; top: -120px; left: -80px;"></div>
      <div class="organic-shape shape-2" style="width: 450px; height: 450px; bottom: -100px; right: -60px;"></div>
      <div class="organic-shape shape-3" style="width: 350px; height: 350px; top: 25%; right: 5%;"></div>
    </div>

    <!-- SVG Blobs décoratifs -->
    <svg class="svg-blob blob-1" viewBox="0 0 200 200">
      <path fill="var(--lavender)" d="M44.7,-76.4C58.8,-69.2,71.8,-59.1,79.6,-45.8C87.4,-32.6,90,-16.3,88.5,-0.9C87,14.6,81.4,29.2,73.1,42.3C64.8,55.4,53.8,67,40.4,74.3C27,81.6,11.2,84.6,-4.5,83.4C-20.2,82.2,-35.8,76.8,-48.7,68.4C-61.6,60,-71.8,48.6,-77.9,35.2C-84,21.8,-86,6.4,-84.1,-8.3C-82.2,-23,-76.4,-37,-66.8,-48.1C-57.2,-59.2,-43.8,-67.4,-29.7,-74.5C-15.6,-81.6,-0.8,-87.6,13.5,-86.8C27.8,-86,30.6,-83.6,44.7,-76.4Z" transform="translate(100 100)" opacity="0.25"/>
    </svg>

    <svg class="svg-blob blob-2" viewBox="0 0 200 200">
      <path fill="var(--mint)" d="M39.5,-65.4C51.4,-58.1,61.5,-47.9,68.2,-35.8C74.9,-23.7,78.2,-9.7,77.4,3.9C76.6,17.5,71.7,30.7,64.1,42.5C56.5,54.3,46.2,64.7,33.8,70.9C21.4,77.1,6.9,79.1,-7.3,77.8C-21.5,76.5,-35.7,71.9,-47.2,64.2C-58.7,56.5,-67.5,45.7,-72.7,33.4C-77.9,21.1,-79.5,7.3,-77.8,-5.9C-76.1,-19.1,-71.1,-31.7,-63.3,-42.7C-55.5,-53.7,-45,-63.1,-32.8,-70C-20.6,-76.9,-6.8,-81.3,5.8,-79.9C18.4,-78.5,27.6,-72.7,39.5,-65.4Z" transform="translate(100 100)" opacity="0.25"/>
    </svg>

    <svg class="svg-blob blob-3" viewBox="0 0 200 200">
      <path fill="var(--peach)" d="M41.3,-69.7C53.4,-62.3,62.7,-51.4,69.3,-39.1C75.9,-26.8,79.8,-13.4,80.2,0.3C80.6,13.9,77.5,27.9,70.8,39.8C64.1,51.7,53.8,61.6,41.9,68.2C30,74.8,16.5,78.1,3.3,76.8C-9.9,75.5,-22.8,69.6,-34.9,62.5C-47,55.4,-58.3,47.1,-65.9,36C-73.5,24.9,-77.4,11,-77.7,-3.2C-78,-17.4,-74.7,-34.8,-66.6,-47.5C-58.5,-60.2,-45.6,-68.2,-32.4,-75C-19.2,-81.8,-5.6,-87.4,6.8,-87.3C19.2,-87.2,29.2,-77.1,41.3,-69.7Z" transform="translate(100 100)" opacity="0.25"/>
    </svg>

    <!-- Zone principale centrale -->
    <div class="main-content">
      <!-- Header avec titre -->
      <div class="header-section glass blob slide-in">
        <div class="header-icon">💬</div>
        <div class="header-text">
          <h1 id="title">Just Chatting</h1>
          <p id="subtitle">On discute tranquillement ✨</p>
        </div>
      </div>

      <!-- Zone de contenu centrale (pour sujet de discussion, questions, etc.) -->
      <div class="topic-section glass blob fade-in" id="topicSection" style="animation-delay: 0.3s;">
        <div class="topic-icon">💭</div>
        <p class="topic-text" id="topicText">Posez vos questions !</p>
      </div>

      <!-- Socials discrets -->
      <div class="socials-bar glass blob fade-in" style="animation-delay: 0.6s;">
        <div class="social-item" id="twitchSocial">
          <span class="social-emoji">📺</span>
          <span class="social-handle" id="twitchHandle">twitch.tv/vous</span>
        </div>
        <div class="social-separator">•</div>
        <div class="social-item" id="discordSocial">
          <span class="social-emoji">💬</span>
          <span class="social-handle" id="discordHandle">discord.gg/vous</span>
        </div>
      </div>
    </div>

    <!-- Zone webcam (en bas à gauche - la webcam sera ajoutée dans OBS) -->
    <div class="webcam-placeholder"></div>

    <!-- Zone chat (en bas à droite - le chat sera ajouté dans OBS) -->
    <div class="chat-placeholder"></div>

    <!-- Décorations de coins -->
    <div class="corner-deco corner-top-left"></div>
    <div class="corner-deco corner-top-right"></div>
    <div class="corner-deco corner-bottom-left"></div>
    <div class="corner-deco corner-bottom-right"></div>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
