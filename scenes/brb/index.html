<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be Right Back</title>
  <link rel="stylesheet" href="../../css/organic-global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="organic-bg">
      <div class="organic-shape shape-1" style="width: 380px; height: 380px; top: -50px; right: -80px;"></div>
      <div class="organic-shape shape-2" style="width: 320px; height: 320px; bottom: -60px; left: -40px;"></div>
      <div class="organic-shape shape-3" style="width: 250px; height: 250px; top: 35%; left: 8%;"></div>
    </div>

    <svg class="svg-blob" style="top: 20%; right: 15%; width: 160px; height: 160px;" viewBox="0 0 200 200">
      <path fill="var(--sky)" d="M41.3,-69.7C53.4,-62.3,62.7,-51.4,69.3,-39.1C75.9,-26.8,79.8,-13.4,80.2,0.3C80.6,13.9,77.5,27.9,70.8,39.8C64.1,51.7,53.8,61.6,41.9,68.2C30,74.8,16.5,78.1,3.3,76.8C-9.9,75.5,-22.8,69.6,-34.9,62.5C-47,55.4,-58.3,47.1,-65.9,36C-73.5,24.9,-77.4,11,-77.7,-3.2C-78,-17.4,-74.7,-34.8,-66.6,-47.5C-58.5,-60.2,-45.6,-68.2,-32.4,-75C-19.2,-81.8,-5.6,-87.4,6.8,-87.3C19.2,-87.2,29.2,-77.1,41.3,-69.7Z" transform="translate(100 100)" opacity="0.25"/>
    </svg>

    <div class="content">
      <div class="icon-blob blob float-soft">
        <div class="icon">☕</div>
      </div>

      <h1 class="title slide-in">Petite pause</h1>
      
      <p class="message fade-in" id="message" style="animation-delay: 0.3s;">Je reviens vite !</p>

      <div class="timer-container glass blob fade-in" id="timerCard" style="animation-delay: 0.6s;">
        <div class="timer" id="timer">00:00</div>
      </div>

      <div class="info-text fade-in" style="animation-delay: 0.9s;">
        <p>💬 Le chat est ouvert</p>
        <p>🎵 Profitez de la musique</p>
      </div>
    </div>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
