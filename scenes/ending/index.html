<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Ended</title>
  <link rel="stylesheet" href="../../css/organic-global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Formes organiques de fond -->
    <div class="organic-bg">
      <div class="organic-shape shape-1" style="width: 420px; height: 420px; top: -120px; right: -60px;"></div>
      <div class="organic-shape shape-2" style="width: 380px; height: 380px; bottom: -100px; left: -70px;"></div>
      <div class="organic-shape shape-3" style="width: 300px; height: 300px; top: 30%; left: 5%;"></div>
      <div class="organic-shape shape-4" style="width: 260px; height: 260px; bottom: 20%; right: 8%;"></div>
    </div>

    <!-- SVG Blobs décoratifs -->
    <svg class="svg-blob" style="top: 15%; right: 12%; width: 220px; height: 220px;" viewBox="0 0 200 200">
      <path fill="var(--lavender)" d="M41.3,-69.7C53.4,-62.3,62.7,-51.4,69.3,-39.1C75.9,-26.8,79.8,-13.4,80.2,0.3C80.6,13.9,77.5,27.9,70.8,39.8C64.1,51.7,53.8,61.6,41.9,68.2C30,74.8,16.5,78.1,3.3,76.8C-9.9,75.5,-22.8,69.6,-34.9,62.5C-47,55.4,-58.3,47.1,-65.9,36C-73.5,24.9,-77.4,11,-77.7,-3.2C-78,-17.4,-74.7,-34.8,-66.6,-47.5C-58.5,-60.2,-45.6,-68.2,-32.4,-75C-19.2,-81.8,-5.6,-87.4,6.8,-87.3C19.2,-87.2,29.2,-77.1,41.3,-69.7Z" transform="translate(100 100)" opacity="0.35"/>
    </svg>

    <svg class="svg-blob" style="bottom: 10%; left: 15%; width: 200px; height: 200px;" viewBox="0 0 200 200">
      <path fill="var(--mint)" d="M44.7,-76.4C58.8,-69.2,71.8,-59.1,79.6,-45.8C87.4,-32.6,90,-16.3,88.5,-0.9C87,14.6,81.4,29.2,73.1,42.3C64.8,55.4,53.8,67,40.4,74.3C27,81.6,11.2,84.6,-4.5,83.4C-20.2,82.2,-35.8,76.8,-48.7,68.4C-61.6,60,-71.8,48.6,-77.9,35.2C-84,21.8,-86,6.4,-84.1,-8.3C-82.2,-23,-76.4,-37,-66.8,-48.1C-57.2,-59.2,-43.8,-67.4,-29.7,-74.5C-15.6,-81.6,-0.8,-87.6,13.5,-86.8C27.8,-86,30.6,-83.6,44.7,-76.4Z" transform="translate(100 100)" opacity="0.35"/>
    </svg>

    <div class="content">
      <!-- Icône coeur dans blob -->
      <div class="heart-blob blob float-soft slide-in">
        <div class="heart-icon">💜</div>
      </div>

      <!-- Titre principal -->
      <h1 class="main-title fade-in" id="title" style="animation-delay: 0.2s;">Merci d'avoir été là !</h1>

      <!-- Sous-titre -->
      <p class="subtitle fade-in" id="subtitle" style="animation-delay: 0.4s;">C'était super cool de jouer avec vous 💜</p>

      <!-- Message de prochain stream -->
      <div class="next-stream glass blob fade-in" style="animation-delay: 0.6s;">
        <div class="next-icon">📅</div>
        <p id="nextStream">On se retrouve bientôt pour de nouvelles aventures</p>
      </div>

      <!-- Socials -->
      <div class="socials-section fade-in" style="animation-delay: 0.8s;">
        <p class="socials-title">Retrouvez-moi sur :</p>
        <div class="socials-grid">
          <a href="#" class="social-link glass blob" id="twitchLink" target="_blank" rel="noopener">
            <span class="social-emoji">📺</span>
            <span class="social-name" id="twitchName">Twitch</span>
          </a>
          <a href="#" class="social-link glass blob" id="discordLink" target="_blank" rel="noopener">
            <span class="social-emoji">💬</span>
            <span class="social-name" id="discordName">Discord</span>
          </a>
          <a href="#" class="social-link glass blob" id="twitterLink" target="_blank" rel="noopener">
            <span class="social-emoji">🐦</span>
            <span class="social-name" id="twitterName">Twitter</span>
          </a>
          <a href="#" class="social-link glass blob" id="youtubeLink" target="_blank" rel="noopener">
            <span class="social-emoji">🎬</span>
            <span class="social-name" id="youtubeName">YouTube</span>
          </a>
        </div>
      </div>

      <!-- Call to action -->
      <div class="cta-box glass blob fade-in" style="animation-delay: 1s;">
        <p id="cta">N'oubliez pas de follow si vous avez aimé !</p>
      </div>

      <!-- Footer doux -->
      <div class="footer fade-in" style="animation-delay: 1.2s;">
        <p>À très vite ! ✨</p>
      </div>
    </div>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
